[package]
name = "kutty-jarvis"
version = "0.1.0"
description = "Free, open-source AI buddy for your PC"
authors = ["kutty-jarvis contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kutty_jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
xcap = "0.9"
cpal = "0.15"
hound = "3.5"
base64 = "0.23"
# HTTP client: local llama-server calls and the Piper download (rustls, no
# OpenSSL, via default features).
ureq = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(windows))'.dependencies]
# Piper's Linux build ships as tar.gz (development and tests only).
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
# API keys live in Windows Credential Manager (ADR 0015).
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# UI Automation (element list), overlay window styles and SAPI speech. Same
# version Tauri already pulls in, so it adds no new crate to the build.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Speech",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
